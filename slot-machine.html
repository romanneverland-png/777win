<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lucky Spin — Эксперимент</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');

  :root {
    --gold: #FFD700;
    --gold-dark: #B8860B;
    --neon-pink: #FF2D95;
    --neon-blue: #00F0FF;
    --neon-green: #39FF14;
    --neon-purple: #BF40BF;
    --bg-dark: #0a0a1a;
    --bg-card: #12122a;
    --bg-reel: #080818;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Russo One', sans-serif;
    background: var(--bg-dark);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(191,64,191,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0,240,255,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(255,45,149,0.06) 0%, transparent 50%);
    z-index: 0;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 12px 0;
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 28px;
    background: linear-gradient(135deg, var(--gold), #fff, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.3));
    letter-spacing: 2px;
  }

  .header .subtitle {
    font-family: 'Press Start 2P', cursive;
    font-size: 9px;
    color: var(--neon-blue);
    margin-top: 6px;
    text-shadow: 0 0 10px var(--neon-blue);
    letter-spacing: 1px;
  }

  /* Balance bar */
  .balance-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 12px;
    padding: 12px 18px;
    box-shadow: 0 0 20px rgba(255,215,0,0.05);
  }

  .balance-item {
    text-align: center;
  }

  .balance-label {
    font-size: 9px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .balance-value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,215,0,0.3);
  }

  .balance-value.bonus {
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57,255,20,0.3);
  }

  .spins-value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--neon-blue);
    text-shadow: 0 0 10px rgba(0,240,255,0.3);
  }

  /* Slot machine */
  .machine {
    width: 100%;
    background: linear-gradient(180deg, #1a1a3a 0%, var(--bg-card) 100%);
    border: 2px solid rgba(255,215,0,0.3);
    border-radius: 20px;
    padding: 20px 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 
      0 0 40px rgba(255,215,0,0.1),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .machine::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border-radius: 22px;
    background: linear-gradient(45deg, var(--gold), transparent, var(--neon-pink), transparent, var(--gold));
    z-index: -1;
    opacity: 0.4;
    animation: borderGlow 4s linear infinite;
  }

  @keyframes borderGlow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .reels-container {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 12px 0;
    perspective: 600px;
  }

  .reel {
    width: 90px;
    height: 100px;
    background: var(--bg-reel);
    border-radius: 12px;
    border: 2px solid rgba(255,215,0,0.15);
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
  }

  .reel-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transition: transform 0.1s;
  }

  .reel-symbol {
    width: 100%;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }

  .reel::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(
      180deg,
      rgba(10,10,26,0.7) 0%,
      transparent 30%,
      transparent 70%,
      rgba(10,10,26,0.7) 100%
    );
    pointer-events: none;
    z-index: 2;
  }

  /* Win line indicator */
  .win-line {
    position: absolute;
    top: 50%;
    left: -4px;
    right: -4px;
    height: 3px;
    background: var(--gold);
    transform: translateY(-50%);
    z-index: 3;
    box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
    opacity: 0.5;
    border-radius: 2px;
  }

  /* Spin button */
  .spin-btn {
    width: 100%;
    padding: 16px;
    margin-top: 8px;
    border: none;
    border-radius: 14px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), #fff5cc, var(--gold), var(--gold-dark));
    background-size: 200% 200%;
    color: #1a0a00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    box-shadow: 0 4px 20px rgba(255,215,0,0.3), 0 2px 0 #8B6914;
    animation: btnShimmer 3s ease-in-out infinite;
  }

  @keyframes btnShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .spin-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(255,215,0,0.4), 0 3px 0 #8B6914;
  }

  .spin-btn:active {
    transform: translateY(1px);
    box-shadow: 0 2px 10px rgba(255,215,0,0.3), 0 1px 0 #8B6914;
  }

  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    animation: none;
  }

  /* Result display */
  .result {
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
  }

  .result-text {
    font-family: 'Press Start 2P', cursive;
    font-size: 11px;
    line-height: 1.8;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .result-text.show {
    opacity: 1;
    transform: scale(1);
  }

  .result-text.win {
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }

  .result-text.jackpot {
    color: var(--neon-pink);
    text-shadow: 0 0 20px rgba(255,45,149,0.5);
    font-size: 14px;
    animation: jackpotPulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes jackpotPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }

  .result-text.bonus {
    color: var(--neon-green);
    text-shadow: 0 0 20px rgba(57,255,20,0.5);
  }

  .result-text.lose {
    color: rgba(255,255,255,0.4);
  }

  /* Reward popup */
  .reward-popup {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .reward-popup.show {
    opacity: 1;
    pointer-events: all;
  }

  .reward-card {
    background: linear-gradient(135deg, #1a1a3a, #2a1a4a);
    border: 2px solid var(--gold);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 60px rgba(255,215,0,0.2);
  }

  .reward-popup.show .reward-card {
    transform: scale(1);
  }

  .reward-emoji {
    font-size: 64px;
    margin-bottom: 16px;
    animation: rewardBounce 0.6s ease-in-out infinite alternate;
  }

  @keyframes rewardBounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-10px); }
  }

  .reward-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .reward-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .reward-claim {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #1a0a00;
    border: none;
    padding: 12px 32px;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 2px;
  }

  /* History / Log */
  .log-section {
    width: 100%;
    margin-top: 8px;
  }

  .log-toggle {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 18px;
    color: rgba(255,255,255,0.5);
    font-family: 'Russo One', sans-serif;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1px;
  }

  .log-toggle .arrow {
    transition: transform 0.3s;
  }

  .log-toggle.open .arrow {
    transform: rotate(180deg);
  }

  .log-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    background: var(--bg-card);
    border-radius: 0 0 10px 10px;
    margin-top: -5px;
  }

  .log-list.open {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.05);
    border-top: none;
  }

  .log-entry {
    padding: 8px 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .log-entry .log-result {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
  }

  .log-entry .log-result.w { color: var(--gold); }
  .log-entry .log-result.j { color: var(--neon-pink); }
  .log-entry .log-result.b { color: var(--neon-green); }
  .log-entry .log-result.l { color: rgba(255,255,255,0.25); }

  .log-entry .log-symbols {
    font-size: 18px;
    letter-spacing: 4px;
  }

  /* Streak indicator */
  .streak {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-card);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .streak-label {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .streak-dots {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .streak-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: all 0.3s;
  }

  .streak-dot.hit {
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold);
  }

  .streak-dot.miss {
    background: rgba(255,60,60,0.4);
  }

  /* Particles for win */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
  }

  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: particleFall linear forwards;
  }

  @keyframes particleFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Near-miss highlight */
  .reel.near-miss {
    animation: nearMissShake 0.5s ease-in-out;
  }

  @keyframes nearMissShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.2); border-radius: 2px; }

  /* Export button */
  .export-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(0,240,255,0.3);
    border-radius: 10px;
    color: var(--neon-blue);
    font-family: 'Russo One', sans-serif;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .export-btn:hover {
    background: rgba(0,240,255,0.05);
    border-color: var(--neon-blue);
  }

  .stats-row {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--neon-blue);
  }

  .stat-label {
    font-size: 8px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <h1>LUCKY SPIN</h1>
    <div class="subtitle">🎰 КРУТИ И ВЫИГРЫВАЙ 🎰</div>
  </div>

  <div class="balance-bar">
    <div class="balance-item">
      <div class="balance-label">Монеты</div>
      <div class="balance-value" id="coins">1000</div>
    </div>
    <div class="balance-item">
      <div class="balance-label">Бонусы</div>
      <div class="balance-value bonus" id="bonuses">0</div>
    </div>
    <div class="balance-item">
      <div class="balance-label">Спины</div>
      <div class="spins-value" id="totalSpins">0</div>
    </div>
  </div>

  <div class="machine">
    <div class="reels-container">
      <div class="reel" id="reel0"><div class="reel-inner"><div class="reel-symbol">🍒</div></div></div>
      <div class="reel" id="reel1"><div class="reel-inner"><div class="reel-symbol">🍒</div></div></div>
      <div class="reel" id="reel2"><div class="reel-inner"><div class="reel-symbol">🍒</div></div></div>
      <div class="win-line"></div>
    </div>

    <div class="result">
      <div class="result-text" id="resultText"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
  </div>

  <div class="streak">
    <span class="streak-label">Последние:</span>
    <div class="streak-dots" id="streakDots"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="winRate">0%</div>
      <div class="stat-label">Винрейт</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="maxWin">0</div>
      <div class="stat-label">Макс выигрыш</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="currentStreak">0</div>
      <div class="stat-label">Серия</div>
    </div>
  </div>

  <div class="log-section">
    <button class="log-toggle" id="logToggle" onclick="toggleLog()">
      <span>📋 ЖУРНАЛ СПИНОВ</span>
      <span class="arrow">▼</span>
    </button>
    <div class="log-list" id="logList"></div>
  </div>

  <button class="export-btn" onclick="exportData()">📊 ЭКСПОРТ ДАННЫХ (CSV)</button>
</div>

<div class="reward-popup" id="rewardPopup">
  <div class="reward-card">
    <div class="reward-emoji" id="rewardEmoji">🎁</div>
    <div class="reward-title" id="rewardTitle">БОНУС!</div>
    <div class="reward-desc" id="rewardDesc">Описание награды</div>
    <button class="reward-claim" onclick="closeReward()">ЗАБРАТЬ</button>
  </div>
</div>

<div class="particles" id="particles"></div>

<script>
  // === GAME STATE ===
  const SYMBOLS = ['🍒', '🍋', '🔔', '💎', '7️⃣', '🍀', '⭐', '🎰'];
  const SYMBOL_WEIGHTS = [25, 22, 18, 12, 8, 7, 5, 3]; // Higher = more common

  let state = {
    coins: 1000,
    bonuses: 0,
    totalSpins: 0,
    wins: 0,
    losses: 0,
    maxWin: 0,
    currentStreak: 0,
    bestStreak: 0,
    history: [],       // last 20 results for streak dots
    log: [],           // full session log for export
    spinning: false,
    sessionStart: new Date().toISOString()
  };

  // === WEIGHTED RANDOM ===
  function weightedRandom() {
    const totalWeight = SYMBOL_WEIGHTS.reduce((a, b) => a + b, 0);
    let r = Math.random() * totalWeight;
    for (let i = 0; i < SYMBOLS.length; i++) {
      r -= SYMBOL_WEIGHTS[i];
      if (r <= 0) return SYMBOLS[i];
    }
    return SYMBOLS[0];
  }

  // === PAYOUT TABLE ===
  function calcPayout(s1, s2, s3) {
    if (s1 === s2 && s2 === s3) {
      // Triple match
      const idx = SYMBOLS.indexOf(s1);
      const payouts = [50, 60, 80, 150, 300, 200, 400, 777];
      return { type: 'jackpot', amount: payouts[idx] || 50, label: `ДЖЕКПОТ ${s1}×3` };
    }
    if (s1 === s2 || s2 === s3 || s1 === s3) {
      return { type: 'win', amount: 25, label: 'Пара!' };
    }
    // Bonus: any star or clover
    if ([s1, s2, s3].includes('🍀')) {
      return { type: 'bonus', amount: 1, label: 'Бонус 🍀' };
    }
    if ([s1, s2, s3].includes('⭐')) {
      return { type: 'bonus', amount: 1, label: 'Бонус ⭐' };
    }
    return { type: 'lose', amount: 0, label: '' };
  }

  // === MILESTONE REWARDS ===
  const MILESTONES = {
    5:   { emoji: '🎁', title: 'Первый бонус!', desc: 'Ты сделал 5 спинов! +100 монет', coins: 100 },
    15:  { emoji: '🔥', title: 'Разогрев!', desc: '15 спинов! +200 монет и бонус', coins: 200, bonus: 1 },
    30:  { emoji: '💫', title: 'На волне!', desc: '30 спинов! +300 монет', coins: 300 },
    50:  { emoji: '🏆', title: 'Полтинник!', desc: '50 спинов! +500 монет и 2 бонуса', coins: 500, bonus: 2 },
    75:  { emoji: '👑', title: 'Легенда!', desc: '75 спинов! +700 монет', coins: 700 },
    100: { emoji: '🌟', title: 'СОТНЯ!', desc: '100 спинов! +1000 монет и 5 бонусов', coins: 1000, bonus: 5 },
  };

  // === SPIN LOGIC ===
  function spin() {
    if (state.spinning) return;
    if (state.coins < 10) {
      showResult('Недостаточно монет!', 'lose');
      return;
    }

    state.spinning = true;
    state.coins -= 10;
    state.totalSpins++;
    updateUI();

    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.textContent = '...';

    const finalSymbols = [weightedRandom(), weightedRandom(), weightedRandom()];

    // Animate each reel
    const reels = [0, 1, 2];
    const durations = [1200, 1600, 2000];
    
    reels.forEach((idx, i) => {
      animateReel(idx, finalSymbols[idx], durations[i]);
    });

    // After all reels stop
    setTimeout(() => {
      const payout = calcPayout(...finalSymbols);
      processResult(payout, finalSymbols);

      // Check near-miss (2 matching but not 3)
      if (payout.type === 'lose') {
        const unique = new Set(finalSymbols).size;
        if (unique === 2) {
          // Near miss!
          document.querySelectorAll('.reel').forEach(r => {
            r.classList.add('near-miss');
            setTimeout(() => r.classList.remove('near-miss'), 600);
          });
        }
      }

      btn.disabled = false;
      btn.textContent = 'КРУТИТЬ';
      state.spinning = false;

      // Check milestones
      if (MILESTONES[state.totalSpins]) {
        setTimeout(() => showMilestone(MILESTONES[state.totalSpins]), 500);
      }
    }, 2200);
  }

  function animateReel(idx, finalSymbol, duration) {
    const reel = document.getElementById('reel' + idx);
    const inner = reel.querySelector('.reel-inner');
    
    // Build reel strip with random symbols + final
    const count = Math.floor(duration / 80);
    let html = '';
    for (let i = 0; i < count; i++) {
      const s = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      html += `<div class="reel-symbol">${s}</div>`;
    }
    html += `<div class="reel-symbol">${finalSymbol}</div>`;
    inner.innerHTML = html;

    const totalHeight = (count + 1) * 100;
    inner.style.transition = 'none';
    inner.style.transform = 'translateY(0)';

    requestAnimationFrame(() => {
      inner.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.8, 0.3, 1)`;
      inner.style.transform = `translateY(-${totalHeight - 100}px)`;
    });
  }

  function processResult(payout, symbols) {
    const entry = {
      spin: state.totalSpins,
      symbols: symbols.join(''),
      type: payout.type,
      amount: payout.amount,
      coinsAfter: state.coins,
      time: new Date().toISOString()
    };

    if (payout.type === 'jackpot') {
      state.coins += payout.amount;
      state.wins++;
      state.currentStreak++;
      if (payout.amount > state.maxWin) state.maxWin = payout.amount;
      showResult(payout.label + ' +' + payout.amount, 'jackpot');
      spawnParticles(30);
    } else if (payout.type === 'win') {
      state.coins += payout.amount;
      state.wins++;
      state.currentStreak++;
      if (payout.amount > state.maxWin) state.maxWin = payout.amount;
      showResult(payout.label + ' +' + payout.amount, 'win');
      spawnParticles(10);
    } else if (payout.type === 'bonus') {
      state.bonuses += payout.amount;
      state.wins++;
      state.currentStreak++;
      showResult(payout.label, 'bonus');
    } else {
      state.losses++;
      state.currentStreak = 0;
      showResult('Попробуй ещё!', 'lose');
    }

    if (state.currentStreak > state.bestStreak) {
      state.bestStreak = state.currentStreak;
    }

    entry.coinsAfter = state.coins;
    state.log.push(entry);
    state.history.push(payout.type !== 'lose' ? 'hit' : 'miss');
    if (state.history.length > 20) state.history.shift();

    updateUI();
  }

  // === UI UPDATES ===
  function updateUI() {
    document.getElementById('coins').textContent = state.coins;
    document.getElementById('bonuses').textContent = state.bonuses;
    document.getElementById('totalSpins').textContent = state.totalSpins;
    
    const total = state.wins + state.losses;
    document.getElementById('winRate').textContent = total ? Math.round((state.wins / total) * 100) + '%' : '0%';
    document.getElementById('maxWin').textContent = state.maxWin;
    document.getElementById('currentStreak').textContent = state.currentStreak;

    // Streak dots
    const dots = document.getElementById('streakDots');
    dots.innerHTML = state.history.map(h => 
      `<div class="streak-dot ${h}"></div>`
    ).join('');

    // Log
    const logList = document.getElementById('logList');
    logList.innerHTML = state.log.slice().reverse().slice(0, 50).map(e =>
      `<div class="log-entry">
        <span class="log-symbols">${e.symbols}</span>
        <span class="log-result ${e.type[0]}">${e.type === 'lose' ? '−10' : '+' + e.amount}</span>
        <span style="font-size:9px;color:rgba(255,255,255,0.2)">#${e.spin}</span>
      </div>`
    ).join('');
  }

  function showResult(text, type) {
    const el = document.getElementById('resultText');
    el.className = 'result-text';
    el.textContent = text;
    requestAnimationFrame(() => {
      el.classList.add('show', type);
    });
  }

  function toggleLog() {
    const toggle = document.getElementById('logToggle');
    const list = document.getElementById('logList');
    toggle.classList.toggle('open');
    list.classList.toggle('open');
  }

  // === MILESTONES ===
  function showMilestone(m) {
    document.getElementById('rewardEmoji').textContent = m.emoji;
    document.getElementById('rewardTitle').textContent = m.title;
    document.getElementById('rewardDesc').textContent = m.desc;
    document.getElementById('rewardPopup').classList.add('show');
    
    state.coins += (m.coins || 0);
    state.bonuses += (m.bonus || 0);
    updateUI();
    spawnParticles(20);
  }

  function closeReward() {
    document.getElementById('rewardPopup').classList.remove('show');
  }

  // === PARTICLES ===
  function spawnParticles(count) {
    const container = document.getElementById('particles');
    const colors = ['#FFD700', '#FF2D95', '#00F0FF', '#39FF14', '#BF40BF', '#fff'];
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = '-10px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = (4 + Math.random() * 8) + 'px';
      p.style.height = p.style.width;
      p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }
  }

  // === EXPORT ===
  function exportData() {
    if (state.log.length === 0) {
      alert('Нет данных для экспорта');
      return;
    }

    let csv = 'Spin,Symbols,Result,Amount,Coins_After,Timestamp\n';
    state.log.forEach(e => {
      csv += `${e.spin},"${e.symbols}",${e.type},${e.amount},${e.coinsAfter},${e.time}\n`;
    });

    // Summary
    const total = state.wins + state.losses;
    csv += '\n\nSESSION SUMMARY\n';
    csv += `Session Start,${state.sessionStart}\n`;
    csv += `Total Spins,${state.totalSpins}\n`;
    csv += `Wins,${state.wins}\n`;
    csv += `Losses,${state.losses}\n`;
    csv += `Win Rate,${total ? Math.round((state.wins/total)*100) : 0}%\n`;
    csv += `Max Win,${state.maxWin}\n`;
    csv += `Best Streak,${state.bestStreak}\n`;
    csv += `Final Coins,${state.coins}\n`;
    csv += `Bonuses Collected,${state.bonuses}\n`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `slot_experiment_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // === TELEGRAM WEB APP INTEGRATION ===
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Get user info for experiment logging
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const user = tg.initDataUnsafe.user;
      state.userId = user.id;
      state.userName = user.first_name;
    }
  }
</script>
